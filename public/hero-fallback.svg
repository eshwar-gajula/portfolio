<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f5a0" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0b0f12"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <circle cx="400" cy="300" r="200" fill="url(#glow)"/>
  <circle cx="200" cy="150" r="3" fill="#00f5a0" opacity="0.6"/>
  <circle cx="600" cy="200" r="2" fill="#00f5a0" opacity="0.4"/>
  <circle cx="150" cy="400" r="2" fill="#6ee7ff" opacity="0.5"/>
  <circle cx="650" cy="450" r="3" fill="#00f5a0" opacity="0.6"/>
  <circle cx="400" cy="100" r="2" fill="#6ee7ff" opacity="0.4"/>
  <circle cx="100" cy="300" r="2" fill="#00f5a0" opacity="0.3"/>
  <circle cx="700" cy="300" r="2" fill="#ff8c42" opacity="0.4"/>
  <line x1="200" y1="150" x2="400" y2="300" stroke="#00f5a0" stroke-width="0.5" opacity="0.2"/>
  <line x1="600" y1="200" x2="400" y2="300" stroke="#00f5a0" stroke-width="0.5" opacity="0.2"/>
  <line x1="650" y1="450" x2="400" y2="300" stroke="#00f5a0" stroke-width="0.5" opacity="0.15"/>
</svg>
